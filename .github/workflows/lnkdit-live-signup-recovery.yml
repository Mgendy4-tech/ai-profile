name: LNKDIT Fresh Signup and Recovery
on:
  push:
    branches: [design/lnkdit-homepage-rich-v1]
    paths: [.github/workflows/lnkdit-live-signup-recovery.yml, lib/browser-live-signup-recovery.cjs, app/company/page.tsx, app/auth/auth-shell.tsx]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lnkdit-live-supabase-ab
  cancel-in-progress: false
jobs:
  signup-recovery:
    if: github.ref == 'refs/heads/design/lnkdit-homepage-rich-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://yeplwaainflckcrjsauw.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_QWxzQMOj4MAUeK_c8O7foQ_9zqmRgox
      NEXT_PUBLIC_BETA_TEST_MODE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Test new signup, private cloud restoration, sign-out and recovery request
        run: |
          npm run start -- -p 3121 >/tmp/lnkdit-signup-recovery.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3121/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = "1"
          timeout 240s node lib/browser-live-signup-recovery.cjs
