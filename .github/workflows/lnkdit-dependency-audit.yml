name: LNKDIT Dependency Audit
on:
  push:
    branches: [design/lnkdit-homepage-rich-v1]
    paths:
      - .github/workflows/lnkdit-dependency-audit.yml
      - package.json
      - package-lock.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Report locked dependency advisories
        run: npm audit --json
