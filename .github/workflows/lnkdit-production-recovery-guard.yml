name: LNKDIT Production Mobile Login
on:
  push:
    branches: [design/lnkdit-homepage-rich-v1]
    paths: [.github/workflows/lnkdit-production-recovery-guard.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lnkdit-live-supabase-ab
  cancel-in-progress: false
jobs:
  production-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f41980c74342f73ed309aa69d96eb2aa0a68f48a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium webkit
      - name: Verify live mobile login, navigation and recovery guards
        env:
          SMOKE_BASE_URL: https://www.lnkdit.com
          SUPABASE_TEST_ACCOUNT_A_EMAIL: mgendy4+lnkdit-a@gmail.com
          SUPABASE_TEST_ACCOUNT_A_PASSWORD: ${{ secrets.SUPABASE_TEST_ACCOUNT_A_PASSWORD }}
        run: |
          timeout 240s node lib/browser-login-flow.cjs
