name: LNKDIT Preview QA

on:
  push:
    branches:
      - design/lnkdit-homepage-rich-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lnkdit-preview-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Automated QA, security and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_PUBLIC_BETA_TEST_MODE: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Next.js 16 generates LayoutProps/PageProps types; a clean runner has no .next/types yet.
      - name: Generate Next.js route and layout types
        run: npx next typegen
      - name: Run automated QA (includes recovery guards and TypeScript)
        run: npm run qa:beta
      - name: Verify production build without enabling beta fixtures
        run: npm run build
      - name: Install headless Chromium and WebKit for responsive QA
        run: npx playwright-core install --with-deps chromium webkit
      - name: Run automated homepage responsive browser QA
        shell: bash
        run: |
          npm run start -- -p 3108 > /tmp/lnkdit-ci-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3108/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/lnkdit-ci-next.log
            exit 1
          fi
          node lib/browser-homepage-responsive.cjs http://127.0.0.1:3108
